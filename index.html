<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Présentation & Escape Game</title>
    <!-- Chargement de Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chargement de la police Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-6 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Conteneur principal centré -->
    <main class="w-full max-w-4xl mx-auto text-center space-y-10">
        
        <!-- En-tête épuré -->
        <header class="space-y-3">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900">
                Bienvenue
            </h1>
            <p class="text-slate-500 text-base sm:text-lg max-w-md mx-auto">
                Choisissez une option ci-dessous pour explorer notre univers ou relever le défi.
            </p>
        </header>

        <!-- Conteneur des trois boutons principaux -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
            
            <!-- Bouton 1 : Lien direct vers l'Accueil -->
            <a 
                href="accueil.html"
                class="group w-full px-6 py-6 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-300 hover:-translate-y-1 active:translate-y-0 transition-all duration-200 flex flex-col items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
            >
                <!-- Icône Accueil (Maison) -->
                <span class="p-3.5 rounded-xl bg-emerald-50 text-emerald-600 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </span>
                <span class="text-lg font-semibold text-slate-800 group-hover:text-emerald-600 transition-colors">
                    Escape Game
                </span>
            </a>

            <!-- Bouton 2 : Lien direct vers la Présentation -->
            <a 
                href="road_to_uni_interactive_5_minute_pitch.html"
                class="group w-full px-6 py-6 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md hover:border-indigo-300 hover:-translate-y-1 active:translate-y-0 transition-all duration-200 flex flex-col items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
                <!-- Icône Présentation -->
                <span class="p-3.5 rounded-xl bg-indigo-50 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </span>
                <span class="text-lg font-semibold text-slate-800 group-hover:text-indigo-600 transition-colors">
                    Présentation
                </span>
            </a>

            <!-- Bouton 3 : Lien direct vers l'Escape Game -->
            <a 
                href="escape_game.html"
                class="group w-full px-6 py-6 bg-slate-900 border border-slate-900 rounded-2xl shadow-sm hover:shadow-lg hover:bg-slate-800 hover:-translate-y-1 active:translate-y-0 transition-all duration-200 flex flex-col items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
            >
                <!-- Icône Escape Game (Clé / Énigme) -->
                <span class="p-3.5 rounded-xl bg-slate-800 text-amber-400 group-hover:bg-amber-400 group-hover:text-slate-900 transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </span>
                <span class="text-lg font-semibold text-white">
                    Game test
                </span>
            </a>

        </div>

    </main>

</body>
</html>
