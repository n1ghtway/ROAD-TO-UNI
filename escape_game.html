<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEOMA — The Missing Student</title><style>
:root{--bg:#080d17;--panel:#111c2c;--line:#30465c;--ink:#edf5f7;--muted:#a6b7c7;--accent:#49e2c2;--red:#ff697a;--gold:#f4ca79}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#19334a 0%,#080d17 55%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-size:18px;font-weight:900;letter-spacing:.17em}.brand span{color:var(--accent)}.micro{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.pill{border:1px solid #3d6571;border-radius:100px;padding:8px 12px;font-size:12px;color:var(--accent)}.hero{padding:64px 0 28px;max-width:820px}h1{font-size:clamp(42px,7vw,78px);line-height:.99;letter-spacing:-.055em;margin:15px 0 20px}h1 em{color:var(--accent);font-style:normal}h2{font-size:clamp(26px,4vw,40px);letter-spacing:-.035em;margin:9px 0 16px}p{color:var(--muted);line-height:1.65}.lead{font-size:18px;max-width:670px}.button{border:0;background:var(--accent);color:#071b21;border-radius:9px;padding:14px 22px;font-weight:800}.button:hover{filter:brightness(1.12)}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.button:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.panel{background:linear-gradient(140deg,#132237,#0d1828);border:1px solid var(--line);border-radius:15px;padding:24px;box-shadow:0 15px 45px #0003}.introgrid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:22px}.file{border-left:3px solid var(--red);padding-left:16px;color:#e6d7d7;font-family:Georgia,serif;font-style:italic;line-height:1.8}.stamp{color:var(--red);border:2px solid var(--red);display:inline-block;padding:9px 14px;transform:rotate(-7deg);font-weight:900;letter-spacing:.15em}.progress{display:flex;gap:6px;margin:20px 0 24px}.seg{height:5px;border-radius:10px;background:#263d4c;flex:1}.seg.done{background:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.location{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.clue{padding:16px;background:#0a1421;border:1px dashed #466077;border-radius:9px;margin:14px 0;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.evidence{background:#17283b;border:1px solid #456078;padding:15px;border-radius:9px}.evidence strong{display:block;color:var(--gold);margin-bottom:6px}.evidence small{color:var(--muted);line-height:1.6}.field{width:100%;background:#091421;border:1px solid #50687b;color:white;border-radius:9px;padding:15px;outline:none}.field:focus{border-color:var(--accent)}.feedback{margin-top:12px;min-height:26px;font-weight:700}.bad{color:var(--red)}.good{color:var(--accent)}.sideTitle{font-weight:800;margin-bottom:13px}.item{border-bottom:1px solid #2b4053;padding:10px 0;font-size:13px;color:#bdcbd6}.item b{color:var(--accent)}.hidden{display:none!important}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.map div{padding:18px 8px;text-align:center;border:1px solid #385368;border-radius:8px;font-size:12px;background:#15283a}.map .active{border-color:var(--accent);color:var(--accent)}.tiny{font-size:12px}.footer{margin:30px 0;color:#7d94a5;font-size:11px}.timer{font-variant-numeric:tabular-nums;font-weight:900}.label{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px}.choice{display:block;width:100%;text-align:left;border:1px solid #3c5568;background:#14273a;color:var(--ink);padding:14px;margin:8px 0;border-radius:9px}.choice.selected{border-color:var(--accent);background:#1c3e43}.reveal{background:#102b2e;border:1px solid #39786f;border-radius:10px;padding:18px;margin-top:18px}.steps{display:flex;gap:10px;flex-wrap:wrap}.steps span{background:#162b3a;border-radius:7px;padding:10px;font-size:12px;color:#b8cdd6}.case{color:var(--gold);letter-spacing:.12em;font-size:12px;font-weight:800}@media(max-width:750px){.layout,.introgrid{grid-template-columns:1fr}.shell{padding:15px}.hero{padding-top:36px}.cards{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">NEOMA <span>///</span> CASE 001</div><div class="micro">Campus orientation investigation · concept prototype</div></div><div class="pill" id="status">CLASSIFIED</div></header><main id="app"></main><div class="footer">FICTIONAL STORY • CAMPUS LOCATIONS TO BE CONFIRMED WITH NEOMA • NO PERSONAL DATA COLLECTED • DEMONSTRATION PROTOTYPE</div></div><script>
const app=document.getElementById('app'),status=document.getElementById('status');let stage=0,seconds=0,tick=null,hints=0,errors=0,selected='',collected=[];const stages=[{name:'THE IDENTITY GLITCH',place:'Student Services / Administration',task:'Identify the altered student record.',hint:'Look for the record that contradicts itself: a departure before an arrival.',answer:'B',token:'MIRROR',detail:'Record B contains an impossible timeline. The recovered keyword is MIRROR.'},{name:'THE INVISIBLE CAMPUS',place:'Campus map / Library',task:'Follow the correct sequence of campus services.',hint:'A student needs to register first, research second, and eat third.',answer:'312',token:'17',detail:'The order is Administration (3), Library (1), Cafeteria (2). Evidence: 17.'},{name:'THE BROKEN TRANSMISSION',place:'Library / Study Area',task:'Decode the transmission from Alex.',hint:'The first letter of each line is the message.',answer:'SCHEDULE',token:'NORTH',detail:'The acrostic reads SCHEDULE. Evidence: NORTH.'},{name:'THE IMPOSSIBLE TIMETABLE',place:'Classroom / Academic Area',task:'Find the impossible appointment.',hint:'Compare the appointment against the building opening hours shown in the case file.',answer:'23:30',token:'ALEX',detail:'The appointment at 23:30 conflicts with the fictional schedule. Evidence: ALEX.'},{name:'THE FINAL ACCUSATION',place:'Final Investigation / Student Hub',task:'Use the evidence to identify what really happened.',hint:'Read the evidence log: the disappearance concerns a digital identity, not a person.',answer:'ALEX',token:'CASE CLOSED',detail:'Alex erased his own digital record as a fictional test of teamwork and campus discovery.'}];
function timer(){if(tick)return;tick=setInterval(()=>{seconds++;let e=document.getElementById('timer');if(e)e.textContent=fmt(seconds)},1000)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function btn(label,fn,cls=''){return `<button class="button ${cls}" onclick="${fn}">${label}</button>`}function go(){stage=1;timer();render()}function reset(){clearInterval(tick);tick=null;stage=0;seconds=0;hints=0;errors=0;selected='';collected=[];render()}function progress(){return `<div class="progress">${stages.map((_,i)=>`<div class="seg ${i<stage-1?'done':''}"></div>`).join('')}</div>`}function sidebar(){return `<aside class="panel"><div class="sideTitle">EVIDENCE LOG <span style="color:var(--accent)">${collected.length}/5</span></div>${collected.length?collected.map((c,i)=>`<div class="item"><b>0${i+1} / ${c.token}</b><br>${c.detail}</div>`).join(''):'<p class="tiny">Evidence will appear here as you solve each challenge.</p>'}<div style="margin-top:22px" class="micro">Investigation timer</div><div id="timer" style="font-size:34px;margin-top:7px" class="timer">${fmt(seconds)}</div><p class="tiny">Hints used: ${hints} · Incorrect attempts: ${errors}</p></aside>`}function render(){status.textContent=stage===0?'CLASSIFIED':stage===6?'SOLVED':`MISSION ${String(stage).padStart(2,'0')}/05`;if(stage===0){app.innerHTML=`<section class="hero"><div class="case">CONFIDENTIAL FILE · NEOMA CAMPUS</div><h1>THE <em>MISSING</em><br>STUDENT</h1><p class="lead">A student named Alex Morgan has vanished from the university database. Five pieces of evidence remain scattered across the campus. Can your team reconstruct the truth?</p><div class="actions">${btn('BEGIN INVESTIGATION →','go()')}</div></section><div class="introgrid"><div class="panel"><div class="micro">Last recorded transmission</div><p class="file">“They erased my identity. Five clues are hidden in the places every new student should know. Find the truth before the system resets.”</p><div class="steps"><span>5 connected challenges</span><span>~30–35 minutes</span><span>2–6 investigators</span></div></div><div class="panel"><div class="stamp">MISSING</div><p>CASE SUBJECT<br><strong style="color:white">ALEX MORGAN</strong></p><p class="tiny">Your mission is to discover campus services while solving a fictional mystery.</p></div></div>`;return}if(stage===6){clearInterval(tick);tick=null;app.innerHTML=`<section class="hero"><div class="case">INVESTIGATION COMPLETED</div><h1>CASE <em>CLOSED.</em></h1><p class="lead">Alex was never physically missing. Alex deleted a fictional student record to create a test of teamwork, observation and campus orientation.</p><div class="reveal"><strong>WELCOME TO NEOMA, INVESTIGATORS.</strong><p>You've explored the key campus services, combined evidence and solved the mystery together.</p><div class="steps"><span>Time: ${fmt(seconds)}</span><span>Hints: ${hints}</span><span>Attempts missed: ${errors}</span></div></div><div class="actions">${btn('PLAY AGAIN','reset()')}${btn('SHOW FACILITATOR ANSWERS','answers()','secondary')}</div></section>`;return}let s=stages[stage-1];app.innerHTML=`${progress()}<div class="layout"><section class="panel"><div class="location">MISSION ${stage} / 05 · ${s.place}</div><h2>${s.name}</h2><p>${s.task}</p>${puzzle(stage)}<label class="label" for="answer">YOUR ANSWER</label><input class="field" id="answer" autocomplete="off" placeholder="Enter the code or answer" onkeydown="if(event.key==='Enter')check()"><div class="actions">${btn('SUBMIT ANSWER','check()')}${btn('REQUEST A HINT','hint()','secondary')}</div><div class="feedback" id="feedback" aria-live="polite"></div></section>${sidebar()}</div>`}function puzzle(n){if(n===1)return `<div class="clue">Four student records were recovered. Which one contains an impossible timeline?</div><div class="cards"><div class="evidence"><strong>RECORD A</strong><small>Registered: 02 Sep<br>Badge issued: 03 Sep</small></div><div class="evidence"><strong>RECORD B</strong><small>Arrived: 12 Sep<br>Left campus: 08 Sep</small></div><div class="evidence"><strong>RECORD C</strong><small>Library access: 10 Sep<br>Orientation: 09 Sep</small></div><div class="evidence"><strong>RECORD D</strong><small>Enrollment: 01 Sep<br>First class: 15 Sep</small></div></div><p class="tiny">Enter A, B, C or D.</p>`;if(n===2)return `<div class="clue">The recovered card reads: “First get registered. Then find information. Finally take a break.”<br><br>Use the location numbers below to enter a three-digit route.</div><div class="map"><div>①<br>LIBRARY</div><div>②<br>CAFETERIA</div><div>③<br>ADMINISTRATION</div></div><p class="tiny">Enter the three numbers without spaces.</p>`;if(n===3)return `<div class="clue" style="font-family:Georgia,serif">Silent corridors hold a clue.<br>Careful investigators look twice.<br>Hidden details matter most.<br>Every answer has a place.<br>Do not trust the obvious.<br>Use what you already know.<br>Look beyond the surface.<br>Every clue has a purpose.</div><p class="tiny">What eight-letter word is hidden in the transmission?</p>`;if(n===4)return `<div class="clue"><strong>FICTIONAL CAMPUS ACCESS RULE</strong><br>For this prototype, academic rooms are accessible from 08:00 to 20:00.<br><br>Recovered appointments:<br>09:15 — Welcome briefing<br>12:30 — Student lunch<br>16:00 — Library orientation<br>23:30 — Private classroom meeting</div><p class="tiny">Which appointment time is impossible under the stated rule? Use HH:MM.</p>`;return `<div class="clue">Evidence recovered:<br>① MIRROR — not everything is as it appears<br>② 17 — case archive reference<br>③ NORTH — where the final message was stored<br>④ ALEX — the identity at the centre of the case<br><br><strong>Final report:</strong> No person is physically missing. Someone intentionally removed a digital identity to test the investigators. Whose record was removed?</div><p class="tiny">Enter the first name.</p>`}function norm(x){return x.trim().toUpperCase().replace(/\s+/g,'')}function check(){let v=document.getElementById('answer').value,f=document.getElementById('feedback'),s=stages[stage-1];if(norm(v)!==s.answer){errors++;f.className='feedback bad';f.textContent='ACCESS DENIED — That is not the correct answer. Review the evidence.';return}collected.push({token:s.token,detail:s.detail});f.className='feedback good';f.innerHTML=`EVIDENCE VERIFIED: ${s.token}. ${s.detail}<div class="actions">${btn(stage===5?'REVEAL THE TRUTH →':'CONTINUE INVESTIGATION →','next()')}</div>`;document.getElementById('answer').disabled=true}function next(){stage++;render();window.scrollTo(0,0)}function hint(){hints++;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='HINT: '+stages[stage-1].hint}function answers(){alert(stages.map((s,i)=>`${i+1}. ${s.name}\nAnswer: ${s.answer}\nHint: ${s.hint}\nEvidence: ${s.token}`).join('\n\n'))}render();
</script></body></html>
